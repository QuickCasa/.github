name: Bug report
description: Something is broken, or doesn't work the way the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Don't report it here. Follow the [security policy](https://github.com/QuickCasa/.github/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The smallest set of steps, code or input that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, package version or commit you're using.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Your browser, operating system and Node.js version, whichever apply.
      placeholder: For example, Firefox on Windows 11, Node.js 22
